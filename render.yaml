# Render Blueprint: one Docker web service serving the API + React UI.
# MongoDB is external (MongoDB Atlas free M0). See README "Deploy free on Render".
services:
  - type: web
    name: reposage
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Free: 512 MB RAM, 0.1 CPU, sleeps after 15 min idle, no disk (indexes are
    # lost on sleep/redeploy). For always-on with persistent indexes use
    # "starter" or higher and uncomment the disk below.
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    # disk:
    #   name: reposage-data
    #   mountPath: /app/data
    #   sizeGB: 5
    envVars:
      - key: MONGO_URI
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      # Only needed if you also host the frontend elsewhere (e.g. Vercel).
      - key: FRONTEND_URL
        sync: false
